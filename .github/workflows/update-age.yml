name: Atualizar idade

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 03:00 UTC (meia-noite no horário de Brasília)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar idade no SVG
        run: python update_age.py

      - name: Commitar se mudou
        run: |
          if git diff --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg
          git commit -m "chore: atualiza idade"
          git push
